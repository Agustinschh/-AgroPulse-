version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.1
    container_name: agropulse-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "19092:19092"
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: agropulse-console
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: agropulse-worker
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["npm", "run", "start:worker"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      KAFKA_BROKERS: redpanda:9092
      AGROMONITORING_API_KEY: ${AGROMONITORING_API_KEY:-c440688126308b448a5d29f39ec5be71}
    restart: on-failure

  simulator:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: agropulse-simulator
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["npm", "run", "start:simulator"]
    environment:
      KAFKA_BROKERS: redpanda:9092
      AGROMONITORING_API_KEY: ${AGROMONITORING_API_KEY:-c440688126308b448a5d29f39ec5be71}
      TICK_INTERVAL_MS: 4000
      SIMULATE_MONTE_A: "false" # false mantiene Monte A en STALE para la defensa
    restart: on-failure
